name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install LPM CLI
        run: npm install --global @lpm-registry/cli@0.76.5 --allow-scripts=@lpm-registry/cli

      - name: Cache the LPM store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lpm/store
          key: lpm-store-${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('lpm.lock') }}
          restore-keys: lpm-store-${{ runner.os }}-node-${{ matrix.node }}-

      - name: Install dependencies for compatibility tests
        if: matrix.node != '22'
        run: lpm ci --strict-integrity --no-engine-strict --no-skills --no-editor-setup --no-security-summary

      - name: Install dependencies for release checks
        if: matrix.node == '22'
        run: lpm ci --strict-integrity --no-skills --no-editor-setup --no-security-summary

      - name: Audit dependencies
        if: matrix.node == '22'
        run: lpm audit --fail-on vuln

      - name: Run compatibility checks
        if: matrix.node != '22'
        run: |
          lpm run typecheck
          lpm run test

      - name: Run release checks
        if: matrix.node == '22'
        run: lpm run release:check

      - name: Check the publish package
        if: matrix.node == '22'
        run: lpm publish --check

  performance:
    name: Performance regression checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install LPM CLI
        run: npm install --global @lpm-registry/cli@0.76.5 --allow-scripts=@lpm-registry/cli

      - name: Cache the LPM store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lpm/store
          key: lpm-store-${{ runner.os }}-performance-${{ hashFiles('lpm.lock') }}
          restore-keys: lpm-store-${{ runner.os }}-performance-

      - name: Install dependencies
        run: lpm ci --strict-integrity --no-skills --no-editor-setup --no-security-summary

      - name: Build the package
        run: lpm run build

      - name: Run performance regression checks
        run: lpm run test:performance

  browser-security:
    name: Browser security (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install LPM CLI
        run: npm install --global @lpm-registry/cli@0.76.5 --allow-scripts=@lpm-registry/cli

      - name: Cache the LPM store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.lpm/store
          key: lpm-store-${{ runner.os }}-browser-${{ hashFiles('lpm.lock') }}
          restore-keys: lpm-store-${{ runner.os }}-browser-

      - name: Install dependencies
        run: lpm ci --strict-integrity --no-skills --no-editor-setup --no-security-summary

      - name: Install browser
        run: lpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build the package
        run: lpm run build

      - name: Run the browser security corpus
        run: lpm run test:browser -- --project=${{ matrix.browser }}
